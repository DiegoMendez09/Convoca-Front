<section class="search-layout">
  <app-process-filters
    [values]="formValues()"
    [fieldErrors]="fieldErrors()"
    (search)="search($event)"
  />

  <div class="results">
    <div class="results-toolbar">
      <p aria-live="polite">
        @if (processesQuery.isSuccess()) {
          {{ totalRecords() }} procesos encontrados
        } @else {
          Resultados de procesos publicados
        }
      </p>
      <button type="button" (click)="exportResults()" [disabled]="exportMutation.isPending()">
        {{ exportMutation.isPending() ? 'Exportando…' : 'Exportar CSV' }}
      </button>
    </div>

    @if (exportNotice()) {
      <p class="export-notice" role="status">{{ exportNotice() }}</p>
    }

    @if (processesQuery.isPending()) {
      <app-loading-state />
    } @else if (processesQuery.isError()) {
      <app-error-state [message]="errorMessage()" (retry)="processesQuery.refetch()" />
    } @else if (totalRecords() === 0) {
      <app-empty-state />
    } @else {
      <app-process-table
        [processes]="processesQuery.data()?.items ?? []"
        [pageNumber]="processesQuery.data()?.pageNumber ?? 1"
        [totalPages]="processesQuery.data()?.totalPages ?? 1"
        (pageChange)="changePage($event)"
      />
    }
  </div>
</section>
